<!DOCTYPE html>
<html lang="en" data-lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0b0b0c; --text: #f5f5f7; --text-muted: #a1a1a6;
  --divider: rgba(245,245,247,.1); --ink: #e8835c; --ink-text: #111113;
  --font: 'Be Vietnam Pro', system-ui, sans-serif;
}
[data-theme="light"] {
  --bg: #f5f5f7; --text: #1d1d1f; --text-muted: #56565b;
  --divider: rgba(29,29,31,.1); --ink: #c4461f; --ink-text: #fbfbfb;
}
body {
  min-height: 100vh; background: var(--bg); color: var(--text);
  font-family: var(--font); display: flex; align-items: center;
  justify-content: center; padding: 24px; text-align: left;
}
.wrap { max-width: 560px; width: 100%; }
.code {
  font-size: clamp(64px, 12vw, 112px); font-weight: 700;
  letter-spacing: -.04em; line-height: 1; color: var(--text-muted);
}
h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 700; letter-spacing: -.035em; margin-top: 18px; }
p { color: var(--text-muted); margin-top: 12px; font-size: 15px; line-height: 1.6; }
.rule { height: 1px; background: var(--divider); margin: 28px 0; }
a.home {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 600; height: 44px; padding: 0 22px; border-radius: 999px;
  background: var(--ink); color: var(--ink-text); text-decoration: none;
}
[data-lang="en"] [data-l="vi"], [data-lang="vi"] [data-l="en"] { display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>
      <span data-l="en">This page doesn't exist</span>
      <span data-l="vi">Trang này không tồn tại</span>
    </h1>
    <p>
      <span data-l="en">The link may be out of date, or the address mistyped. Everything on this site lives on one page.</span>
      <span data-l="vi">Liên kết có thể đã cũ hoặc địa chỉ bị gõ sai. Toàn bộ nội dung của trang nằm trên một trang duy nhất.</span>
    </p>
    <div class="rule"></div>
    <a class="home" href="/">
      <span data-l="en">Back to the portfolio</span>
      <span data-l="vi">Quay lại trang chính</span>
    </a>
  </div>
<script>
  try {
    var r = document.documentElement;
    var lang = localStorage.getItem('khoa.lang') || 'en';
    r.dataset.lang = lang; r.lang = lang === 'vi' ? 'vi' : 'en';
    r.dataset.theme = localStorage.getItem('khoa.theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  } catch (e) {}
</script>
</body>
</html>
